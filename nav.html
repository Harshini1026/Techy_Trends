<html>
   <head>
    <style>
    .nav{
    display: flex;
    background-color: rgb(145, 145, 181);
    height: 70px;
    width: 100%;
    align-items: center;
    justify-content: space-between;
}
.nav .logo{
    font-weight: bold;
    font-size: 20px;
    display: flex;
    align-items: center;
    margin-left: 25px;
}
.nav .logo span{
    margin-left: 5px;
}
.logo img{
    border-radius: 50%;
    height: 35px;
    width: 35px;
}
.logo p{
    margin-left: 3px;
}
.login a{
    display: flex;
    align-items: center;
    text-decoration: none;
    color: inherit;
    gap: 5px;
}
.login img{
    width: 30px;
    height: 30px;
}
.login p{
    margin: 0;
    font-size: 20px;
}
.cart{
    display: flex;
    align-items: center;
    gap: 5px;
    border: none;

    cursor: pointer;

    margin-left: 40px;
    width:80px;
    height:40px;
    margin-top:  15px; 
    margin-bottom: 10px; 
    background-color: rgb(218, 218, 239);  
}
.cart:hover{
    background-color:rgb(127, 127, 187);
}
.seller{
    margin-left: 40px;
    width:100px;
    height:40px;
    margin-top:  15px; ;
    margin-bottom: 10px;
    margin-right: 10px; 
    border-radius: 4px;
    border: none;
    cursor: pointer;
    background-color:rgb(218, 218, 239) ;
}
.seller:hover{
    background-color:rgb(127,127,187);
}
.search input{
    margin-left: 80px;
    width: 500px;
    height:40px;
    margin-top:  15px;
    margin-bottom: 10px;
    border-radius: 20px;
    border: none;
}

</style>
</head>

                <button class="cart"><img src="https://static-assets-web.flixcart.com/batman-returns/batman-returns/p/images/header_cart-eed150.svg">Cart</button>
