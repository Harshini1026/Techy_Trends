<head>
    <style>
        *{
            box-sizing: border-box;
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        .bg{
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://i.pinimg.com/1200x/e2/e8/fa/e2e8faea0c50ffd5552e62bf72020778.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            filter: blur(6px);
            z-index: -1;
            
} 

        
        .login{
            display: flex;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 750px; 
            height: 500px;
            justify-content: center;
            align-items: center;
        }
        .com{
            height: 100%;
            width: 50%;
            object-fit: cover;
            border-radius: 10px;
            margin-right: 20px;
        }
        .line{
            display: flex;
            flex-direction: column;
            margin-left: 20px;
            height: 100%;
            width: 50%;
            object-fit: cover;
            justify-content: center;
            margin-top: 20px;
        }
        .line input{
            width: 92%;
            height:10% ;
            padding: 10px;
            
        }
        .line p{
            margin-top:10px ;
            
        }
        .line h2{
            margin-top:0px;
            margin-bottom: 1px;
        }
        .si{
            margin-top:10px;
            background-color: rgb(110, 60, 151);
            color: white;
            border: 1px solid;
            padding:10px 25px ;
            font-size:16px;
            border-radius: 5px;
            width: 93%;
            cursor: pointer;
        }
        .sg{
            margin-top:10px;
            background-color: black;
            color: white;
            border: 1px solid;
            padding:10px 25px ;
            font-size:16px;
            border-radius: 5px;
            width: 93%;
        }
        .fp{
            color: blue;
            margin-left: 53px;
            cursor:pointer ;
        }
        .sun{
            color: blue;
            margin-left: 40px;
            cursor: pointer;
        }
        .TT{
            height: 35px;
            width: 35px;
            border-radius: 50%;
            
        }

    </style>
</head><body>
    <div class="bg"></div>
    <div class="login">
    <img class="com"src="https://i.pinimg.com/736x/99/c1/dd/99c1dd62a701fc07f57eeeb13477e8fe.jpg" alt="gadgets">
    <form class="line">
    <p style="display: flex; align-items: center; gap: 10px; margin: 0px;">
        <img class="TT" src="IMG_20250720_115803.png"alt="logo">
       <b style="font-size: 18px;">TECHY TRENDS</b></p>
    <h2><b>Get Started Now</b></h2>
        <p>Login</p>
        <input type="text" placeholder="Email or Phone number" id="username" required>
        <p>Password</p>
        <input type="password" placeholder="Enter Password" id="password" required>
        <p>Remember me <span class="fp">Forgot password?</span></p>
        <button class="si" type="submit">Sign in</button><br>
        <button class="sg" type="submit">Sign in with Google</button>
        <p>Dont have an account?<span class="sun">Sign up now</span></p>
    </form>
    <p></p>
</div>
</body>
